name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"

jobs:
  versiones:
    name: Versiones
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar consistencia Python
        run: |
          set -e
          DOCKER_PY=$(grep '^FROM python:' Dockerfile | head -1 | sed 's/.*python:\([0-9.]*\).*/\1/')
          PYPROJECT_PY=$(grep 'requires-python' pyproject.toml | sed 's/.*>=\([0-9.]*\).*/\1/')
          echo "Dockerfile: $DOCKER_PY"
          echo "pyproject.toml: $PYPROJECT_PY"
          if [[ "$DOCKER_PY" != "$PYPROJECT_PY" ]]; then
            echo "❌ Versiones inconsistentes"
            exit 1
          fi
          echo "✅ Versiones consistentes: Python $DOCKER_PY"

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      - run: uv run ruff check .

  typecheck:
    name: Type check (ty)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --dev
      - run: uv run ty check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # `api.py` importa weasyprint a nivel de módulo y la suite genera PDFs
      # reales, así que el runner necesita pango (el Dockerfile ya lo instala).
      # Los nombres cambian entre Ubuntu 22.04/24.04 (suffix t64 en noble).
      - name: Libs de sistema para weasyprint (export PDF)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpango-1.0-0 libpangoft2-1.0-0 \
            || sudo apt-get install -y --no-install-recommends libpango-1.0-0t64 libpangoft2-1.0-0t64
      - run: uv sync --dev
      - run: uv run pytest -q

  build:
    name: Build image
    runs-on: ubuntu-latest
    needs: [versiones, lint, typecheck, tests]
    steps:
      - uses: actions/checkout@v4
      # --format docker: en OCI (default de podman) se descarta el HEALTHCHECK
      # del Dockerfile con el warning "not supported for OCI image format".
      - run: podman build --format docker -t purplemd:test .
      - run: podman run --rm purplemd:test python -c "import api; print('Import OK')"